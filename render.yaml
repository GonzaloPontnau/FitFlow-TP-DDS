# ================================
# FitFlow - Render Blueprint
# One-click deployment configuration
# ================================
# Usa SQLite (filesystem efímero en Render free tier).
# Los datos se auto-cargan en cada deploy gracias a create_app().

services:
  - type: web
    name: fitflow
    plan: free
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gevent -w 1 -b 0.0.0.0:$PORT 'src.main:create_app()'
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: "INFO"
      - key: PYTHONUNBUFFERED
        value: "1"
